<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#E63946" />
    <title>Offline — CoursesGuy</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        background: #080808;
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      
      .container {
        max-width: 480px;
        width: 100%;
        text-align: center;
        animation: fadeIn 0.5s ease-out;
      }
      
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      .logo {
        width: 96px;
        height: 96px;
        margin: 0 auto 24px;
        border-radius: 20px;
        background: #E63946;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: 1px;
        box-shadow: 0 10px 40px rgba(230, 57, 70, 0.3);
        animation: pulse 2s ease-in-out infinite;
      }
      
      @keyframes pulse {
        0%, 100% { box-shadow: 0 10px 40px rgba(230, 57, 70, 0.3); }
        50% { box-shadow: 0 10px 60px rgba(230, 57, 70, 0.5); }
      }
      
      .icon {
        font-size: 64px;
        margin-bottom: 16px;
        animation: float 3s ease-in-out infinite;
      }
      
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      
      h1 {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 12px;
        background: linear-gradient(135deg, #ffffff 0%, #a0a0a0 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      
      p {
        font-size: 16px;
        color: #a0a0a0;
        line-height: 1.6;
        margin-bottom: 32px;
      }
      
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #E63946;
        color: #ffffff;
        border: none;
        padding: 14px 32px;
        font-size: 16px;
        font-weight: 600;
        border-radius: 12px;
        cursor: pointer;
        text-decoration: none;
        transition: all 0.3s ease;
        box-shadow: 0 4px 20px rgba(230, 57, 70, 0.3);
      }
      
      .btn:hover {
        background: #d62828;
        transform: translateY(-2px);
        box-shadow: 0 8px 30px rgba(230, 57, 70, 0.5);
      }
      
      .btn:active {
        transform: translateY(0);
      }
      
      .status {
        margin-top: 24px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #606060;
      }
      
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #E63946;
        animation: blink 1.5s ease-in-out infinite;
      }
      
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">CG</div>
      
      <div class="icon">📡</div>
      
      <h1>You're Offline</h1>
      
      <p>
        It looks like you've lost your internet connection. 
        Please check your network and try again.
      </p>
      
      <a href="/" class="btn" onclick="window.location.reload(); return false;">
        <span>🔄</span>
        <span>Try Again</span>
      </a>
      
      <div class="status">
        <span class="dot"></span>
        <span>Waiting for connection...</span>
      </div>
    </div>
    
    <script>
      // Auto-reload when connection comes back
      window.addEventListener('online', () => {
        console.log('[Offline Page] Back online — reloading...');
        window.location.href = '/';
      });
      
      // Auto-retry every 5 seconds
      let retryCount = 0;
      const maxRetries = 12; // 60 seconds total
      
      const retryInterval = setInterval(() => {
        retryCount++;
        if (navigator.onLine) {
          clearInterval(retryInterval);
          window.location.href = '/';
        }
        if (retryCount >= maxRetries) {
          clearInterval(retryInterval);
        }
      }, 5000);
    </script>
  </body>
</html>
